    <script>
      (() => {
        const root = document.documentElement;
        const updateThemeColor = () => {
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = root.dataset.theme === 'dark' ? '#101112' : '#f5f0ec';
        };
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
          const storedMode = localStorage.getItem('portfolio-theme');
          const mode = ['light', 'dark', 'system'].includes(storedMode) ? storedMode : 'dark';
          root.dataset.themeMode = mode;
          root.dataset.theme = mode === 'system' ? systemTheme : mode;
          updateThemeColor();
        } catch {
          root.dataset.themeMode = 'dark';
          root.dataset.theme = 'dark';
          updateThemeColor();
        }
      })();
    </script>
